* {

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: #071b2d;
}

header {
  padding: 45px 15px 30px;
  background: linear-gradient(135deg, #071b2d, #243b73);
}

.profile {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid white;
  box-shadow: 0 0 20px #75d5ff;
}

h1 {
  margin: 18px 0 8px;
  letter-spacing: 2px;
}

p {
  color: #dcecff;
}

.buttons {
  margin: 25px 0;
}

.buttons a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 12px 22px;
  margin: 7px;
  border-radius: 25px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
}

.social-icon {
  width: 22px;
  height: 22px;
}

.facebook {
  background: #1877f2;
}

.instagram {
  background: #d62976;
}

.about {
  padding: 25px 15px;
}

/* Shop Section Design */
.shop-section {
  padding: 40px 15px;
  background: #0d2843;
  margin: 20px auto;
  max-width: 500px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.shop-section h2 {
  color: #75d5ff;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 20px;
  text-align: left;
  padding: 0 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #dcecff;
}

.form-group select, .form-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #75d5ff;
  border-radius: 8px;
  background: #061321;
  color: white;
  font-size: 16px;
  outline: none;
}

.price-box {
  font-size: 20px;
  font-weight: bold;
  color: #28a745;
  margin: 15px 0;
}

.captcha-container {
  display: flex;
  justify-content: center;
  margin: 20px 0;
}

.buy-button {
  display: inline-block;
  width: 80%;
  padding: 14px;
  border: none;
  border-radius: 25px;
  background: #28a745;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.buy-button:hover {
  background: #218838;
}

/* bKash Payment Modal/Section */
.bkash {
  padding: 35px 15px;
  background: white;
  color: #333;
  margin-top: 30px;
}

.bkash h2 {
  color: #e2136e;
}

.bkash-number {
  font-size: 25px;
  font-weight: bold;
  color: #e2136e;
  margin: 18px;
}

.bkash-button {
  display: inline-block;
  padding: 13px 25px;
  margin: 7px;
  border: none;
  border-radius: 25px;
  background: #e2136e;
  color: white;
  text-decoration: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
