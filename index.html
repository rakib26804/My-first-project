<!-- Firebase SDK (v9 Modular) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // আপনার Firebase Console থেকে পাওয়া Config তথ্যগুলো নিচে বসাবেন
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.registerAndVerify = function() {
    playClickSound();
    const email = document.getElementById("userEmail").value;
    const password = document.getElementById("userPassword").value;
    const statusMsg = document.getElementById("statusMessage");

    if (!email || !password) {
      statusMsg.style.color = "red";
      statusMsg.innerText = "Please enter email and password!";
      return;
    }

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        sendEmailVerification(userCredential.user)
          .then(() => {
            statusMsg.style.color = "#75d5ff";
            statusMsg.innerText = "Verification email sent to " + email + ". Check your inbox!";
          });
      })
      .catch((error) => {
        statusMsg.style.color = "red";
        statusMsg.innerText = "Error: " + error.message;
      });
  };
</script>

<body>

<script>
function playClickSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch (e) {}
}

function copyBkash() {
  playClickSound();
  navigator.clipboard.writeText("01892882839")
    .then(() => {
      document.getElementById("copyMessage").innerText = "Number Copied Successfully!";
    });
}
</script>
